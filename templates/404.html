<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | HireHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-md-8 text-center">
                <i class="bi bi-exclamation-triangle text-warning" style="font-size: 6rem;"></i>
                <h1 class="display-1 fw-bold mt-4">404</h1>
                <h2 class="mb-4">Page Not Found</h2>
                <p class="lead mb-4">
                    The page you're looking for doesn't exist or has been moved. 
                    Try searching for jobs or browse our available positions.
                </p>
                <div class="d-flex gap-3 justify-content-center">
                    <a href="/" class="btn btn-primary">
                        <i class="bi bi-house-door"></i> Go to Homepage
                    </a>
                    {% if request %}
                        {% if request.user.is_authenticated %}
                            <a href="{{ request.user.get_dashboard_url }}" class="btn btn-outline-secondary">
                                <i class="bi bi-speedometer2"></i> Dashboard
                            </a>
                        {% else %}
                            <a href="/jobs/" class="btn btn-outline-secondary">
                                <i class="bi bi-search"></i> Browse Jobs
                            </a>
                        {% endif %}
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
