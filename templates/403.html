<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Forbidden | HireHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center">
            <div class="col-md-8 text-center">
                <i class="bi bi-shield-exclamation text-danger" style="font-size: 6rem;"></i>
                <h1 class="display-1 fw-bold mt-4">403</h1>
                <h2 class="mb-4">Access Forbidden</h2>
                <p class="lead mb-4">
                    Sorry, you don't have permission to access this page. 
                    This may be because you need to log in with the correct account, 
                    or you don't have the necessary permissions.
                </p>
                <div class="d-flex gap-3 justify-content-center">
                    <a href="/" class="btn btn-primary">
                        <i class="bi bi-house-door"></i> Go to Homepage
                    </a>
                    <a href="/accounts/login/" class="btn btn-outline-secondary">
                        <i class="bi bi-box-arrow-in-right"></i> Login
                    </a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
