{% extends 'base.html' %}

{% block title %}Password Reset Complete - {{ block.super }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-5 text-center">
                    <i class="bi bi-check-circle text-success" style="font-size: 3rem;"></i>
                    <h2 class="mt-3 mb-4">Password Reset Complete</h2>
                    <p class="text-muted">
                        Your password has been set successfully. You can now login with your new password.
                    </p>
                    
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-3">
                        <i class="bi bi-box-arrow-in-right"></i> Go to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
