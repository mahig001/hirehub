{% extends 'base.html' %}

{% block title %}Logout - {{ block.super }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-5 text-center">
                    <i class="bi bi-box-arrow-right text-warning" style="font-size: 3rem;"></i>
                    <h2 class="mt-3 mb-4">Logout</h2>
                    <p class="text-muted">Are you sure you want to logout?</p>
                    
                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger me-2">
                            <i class="bi bi-box-arrow-right"></i> Yes, Logout
                        </button>
                        <a href="{{ user.get_dashboard_url }}" class="btn btn-secondary">
                            Cancel
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
