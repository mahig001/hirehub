{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Update Profile - {{ block.super }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h2 class="mb-4">Update Profile</h2>
                    
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form|crispy }}
                        
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save"></i> Save Changes
                            </button>
                            <a href="{{ user.get_dashboard_url }}" class="btn btn-secondary">
                                Cancel
                            </a>
                        </div>
                    </form>
                    
                    <hr class="my-4">
                    
                    <div class="alert alert-danger">
                        <h5 class="alert-heading">Danger Zone</h5>
                        <p class="mb-2">Once you delete your account, there is no going back.</p>
                        <a href="{% url 'accounts:delete_account' %}" class="btn btn-sm btn-danger">
                            <i class="bi bi-trash"></i> Delete Account
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
